name: Release

# Publish a release on GitHub (Releases → Draft a new release → tag e.g. v0.2.0 → Publish)
# and this builds the APK, signed with the permanent release key, and attaches it to that release.
# The in-app updater then offers it to everyone on an older version.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Release signing key
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing. Without the permanent key, in-app updates can't install. See README → Releasing."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease -PappVersionName="${GITHUB_REF_NAME#v}"

      - name: Rename APK
        # The fixed-name copy keeps .../releases/latest/download/channelbox.apk (and Downloader codes) always current.
        run: |
          cp app/build/outputs/apk/release/app-release.apk "channelbox-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk channelbox.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            channelbox-*.apk
            channelbox.apk
